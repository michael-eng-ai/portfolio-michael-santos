name: Auto Sync News

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */2 * * *"

concurrency:
  group: auto-sync-news
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  sync-news:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          package-manager-cache: false

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check database configuration
        id: guard
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
        run: |
          if [ -n "${DATABASE_URL:-}" ]; then
            echo "db_ready=true" >> "$GITHUB_OUTPUT"
            echo "db_provider=postgres" >> "$GITHUB_OUTPUT"
          elif [ -n "${SUPABASE_URL:-}" ]; then
            echo "db_ready=true" >> "$GITHUB_OUTPUT"
            echo "db_provider=supabase" >> "$GITHUB_OUTPUT"
            echo "::notice title=Using Supabase fallback::DATABASE_URL is not set; falling back to Supabase (DATABASE_PROVIDER=supabase) for news sync."
          else
            echo "db_ready=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=Database not configured::Neither DATABASE_URL nor SUPABASE_URL is set; skipping news sync. Add one under Settings -> Secrets and variables -> Actions to resume."
            {
              echo "## Skipped: database not configured"
              echo ""
              echo "Neither \`DATABASE_URL\` nor \`SUPABASE_URL\` is set, so the news sync step was skipped instead of failing."
              echo "Add the \`DATABASE_URL\` secret (VM PostgreSQL connection string) or the \`SUPABASE_URL\` secret to resume automatic news sync."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Sync RSS news to database
        if: steps.guard.outputs.db_ready == 'true' && vars.VM_OWNS_NEWS_SYNC != 'true'
        run: pnpm content:sync:news
        env:
          DATABASE_PROVIDER: ${{ steps.guard.outputs.db_provider }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DATABASE_SSL: ${{ secrets.DATABASE_SSL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          INDEXNOW_KEY: ${{ secrets.INDEXNOW_KEY }}
