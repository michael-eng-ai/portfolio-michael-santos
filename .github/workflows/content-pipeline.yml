name: Content Pipeline

on:
  workflow_dispatch:
  schedule:
    - cron: "0 11 * * 1-5"

permissions:
  contents: write
  pull-requests: write
  statuses: write

concurrency:
  group: content-pipeline
  cancel-in-progress: true

jobs:
  sync-and-draft:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          package-manager-cache: false

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Sync GitHub project metadata
        run: pnpm content:sync:github
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Sync news from RSS feeds
        run: pnpm content:sync:news

      - name: Generate LinkedIn drafts
        run: pnpm content:linkedin

      - name: Generate X drafts
        run: pnpm content:x

      - name: Validate content
        run: pnpm content:validate

      - name: Create pull request for content updates
        id: create_content_pr
        uses: peter-evans/create-pull-request@v7
        with:
          commit-message: "chore: update content pipeline outputs"
          title: "chore: update content pipeline outputs"
          body: |
            Automated update from the content pipeline workflow.
          branch: chore/content-pipeline-updates

      - name: Mark validation status on generated content PR
        if: steps.create_content_pr.outputs.pull-request-head-sha != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api \
            repos/${{ github.repository }}/statuses/${{ steps.create_content_pr.outputs.pull-request-head-sha }} \
            -f state=success \
            -f context=validate \
            -f description='Validated automated content update' \
            -f target_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
