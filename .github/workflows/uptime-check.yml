name: Uptime Check

# Pings the live site and the news-backend health endpoint on a schedule.
#
# Two severities:
#  - Homepage down -> the run FAILS, triggering GitHub's workflow-failure
#    notification (a real outage worth paging on).
#  - News feed degraded (serving static fallback because the database is
#    unreachable) -> the run only emits a ::warning:: and still succeeds, so a
#    known-degraded news backend does not page the owner on every run.
#
# Override the target without editing this file by setting a repository
# variable named SITE_URL (Settings -> Secrets and variables -> Actions -> Variables).

on:
  workflow_dispatch:
  schedule:
    # Once a day. GitHub may delay scheduled runs under load.
    - cron: "0 12 * * *"

concurrency:
  group: uptime-check
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    env:
      SITE_URL: ${{ vars.SITE_URL || 'https://michael.business' }}

    steps:
      - name: Probe homepage
        run: |
          set -euo pipefail
          url="${SITE_URL%/}/en"
          echo "Checking homepage: $url"
          code="$(curl -sS -o /dev/null -w '%{http_code}' -L --max-time 25 --retry 2 --retry-delay 5 "$url")"
          echo "HTTP $code"
          if [ "$code" != "200" ]; then
            echo "::error title=Site down::Homepage $url returned HTTP $code (expected 200)"
            exit 1
          fi
          echo "Homepage is up."

      - name: Probe news backend health
        run: |
          set -euo pipefail
          url="${SITE_URL%/}/api/health/news"
          echo "Checking news health: $url"
          body="$(mktemp)"
          code="$(curl -sS -o "$body" -w '%{http_code}' -L --max-time 25 --retry 2 --retry-delay 5 "$url" || true)"
          echo "HTTP $code"
          echo "Body: $(cat "$body")"

          ok="$(jq -r '.ok // false' "$body" 2>/dev/null || echo false)"
          source="$(jq -r '.source // "unknown"' "$body" 2>/dev/null || echo unknown)"
          error="$(jq -r '.error // ""' "$body" 2>/dev/null || echo '')"

          if [ "$code" = "200" ] && [ "$ok" = "true" ]; then
            echo "News backend healthy (source: $source)."
            exit 0
          fi

          # Degraded news is a soft signal, not an outage: warn (and record a
          # job summary) but do NOT fail the run, so a known-down database does
          # not page the owner on every scheduled probe.
          echo "::warning title=News feed degraded::Health endpoint returned HTTP $code, ok=$ok, source=$source. ${error}"
          {
            echo "## News feed degraded"
            echo ""
            echo "The site is serving fallback content instead of fresh news — the database backend is unreachable."
            echo "- HTTP: $code, ok: $ok, source: $source"
            echo "- error: ${error}"
            echo ""
            echo "Set the \`DATABASE_URL\` secret to a reachable PostgreSQL to restore fresh news."
          } >> "$GITHUB_STEP_SUMMARY"
