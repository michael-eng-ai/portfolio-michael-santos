name: News Sync

on:
  workflow_dispatch:
  schedule:
    - cron: "0 14 * * *"

concurrency:
  group: news-sync
  cancel-in-progress: true

permissions:
  contents: read
  issues: write

jobs:
  enrich-and-publish-news:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          sparse-checkout: |
            scripts/enrich-news.ts
            scripts/curate-news.ts
            scripts/cleanup-old-news.ts
            scripts/post-news-to-x.ts
            lib/
            patches/
            package.json
            pnpm-lock.yaml
            tsconfig.json

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          package-manager-cache: false

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check database configuration
        id: guard
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
        run: |
          if [ -n "${DATABASE_URL:-}" ]; then
            echo "db_ready=true" >> "$GITHUB_OUTPUT"
            echo "db_provider=postgres" >> "$GITHUB_OUTPUT"
          elif [ -n "${SUPABASE_URL:-}" ]; then
            echo "db_ready=true" >> "$GITHUB_OUTPUT"
            echo "db_provider=supabase" >> "$GITHUB_OUTPUT"
            echo "::notice title=Using Supabase fallback::DATABASE_URL is not set; falling back to Supabase (DATABASE_PROVIDER=supabase) for news enrichment/publication."
          else
            echo "db_ready=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=Database not configured::Neither DATABASE_URL nor SUPABASE_URL is set; skipping news enrichment/publication. Add one under Settings -> Secrets and variables -> Actions to resume."
            {
              echo "## Skipped: database not configured"
              echo ""
              echo "Neither \`DATABASE_URL\` nor \`SUPABASE_URL\` is set, so the news enrichment/publication steps were skipped instead of failing."
              echo "Add the \`DATABASE_URL\` secret (VM PostgreSQL connection string) or the \`SUPABASE_URL\` secret to resume automatic news processing."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Enrich news with editorial analysis
        if: steps.guard.outputs.db_ready == 'true' && vars.VM_OWNS_NEWS_ENRICHMENT != 'true'
        run: pnpm content:enrich:news
        env:
          DATABASE_PROVIDER: ${{ steps.guard.outputs.db_provider }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DATABASE_SSL: ${{ secrets.DATABASE_SSL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          LLM_PROVIDER: groq

      - name: Curate top news for today
        if: steps.guard.outputs.db_ready == 'true' && vars.VM_OWNS_NEWS_ENRICHMENT != 'true'
        run: pnpm content:curate:news
        env:
          DATABASE_PROVIDER: ${{ steps.guard.outputs.db_provider }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DATABASE_SSL: ${{ secrets.DATABASE_SSL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          LLM_PROVIDER: groq

      - name: Cleanup old news items
        if: steps.guard.outputs.db_ready == 'true' && vars.VM_OWNS_NEWS_ENRICHMENT != 'true'
        run: pnpm content:cleanup:news
        env:
          DATABASE_PROVIDER: ${{ steps.guard.outputs.db_provider }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DATABASE_SSL: ${{ secrets.DATABASE_SSL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

      - name: Post new news to X
        if: steps.guard.outputs.db_ready == 'true' && vars.VM_OWNS_X_POSTING != 'true'
        run: pnpm content:post:x
        env:
          DATABASE_PROVIDER: ${{ steps.guard.outputs.db_provider }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DATABASE_SSL: ${{ secrets.DATABASE_SSL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_TOKEN_SECRET: ${{ secrets.X_ACCESS_TOKEN_SECRET }}

      - name: Summarize failure
        if: failure()
        run: |
          {
            echo "## News enrichment/publication failed"
            echo ""
            echo "- RSS sync is expected to be handled by the VM worker during the cutover."
            echo "- Check the workflow logs for the failing step."
            echo "- Verify \`/api/health/news\` on the site."
            echo "- Confirm DATABASE_URL (VM PostgreSQL) is reachable and social credentials are still valid."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Create failure issue
        if: failure()
        run: |
          gh issue create \
            --title "[pipeline] ${{ github.workflow }} failed" \
            --body "Workflow: ${{ github.workflow }}\nRun: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\nRef: ${{ github.ref }}" || true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
