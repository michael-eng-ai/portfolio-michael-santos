name: Daily Trend Briefing

on:
  workflow_dispatch:
  schedule:
    - cron: "23 10 * * *"

concurrency:
  group: daily-trend-briefing
  cancel-in-progress: false

permissions:
  contents: write
  issues: write
  pull-requests: write
  statuses: write
  # Cancel approval-gated CI runs on the bot head branch before auto-merge.
  actions: write

jobs:
  generate-briefing:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          package-manager-cache: false

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check configuration
        id: guard
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          LINKEDIN_ACCESS_TOKEN: ${{ secrets.LINKEDIN_ACCESS_TOKEN }}
          LINKEDIN_PERSON_URN: ${{ secrets.LINKEDIN_PERSON_URN }}
          LINKEDIN_ORGANIZATION_URN: ${{ secrets.LINKEDIN_ORGANIZATION_URN }}
        run: |
          if [ -n "${DATABASE_URL:-}" ]; then
            echo "db_ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "db_ready=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=Database not configured::DATABASE_URL is not set. Add it for Supabase project site (ref ouxycojwjztfqiklvtin) before the briefing can write news rows."
            {
              echo "## Database not configured"
              echo ""
              echo "\`DATABASE_URL\` is not set, so the daily briefing does not write to Supabase project **site** (ref \`ouxycojwjztfqiklvtin\`)."
              echo "Add that project's Postgres URI as the \`DATABASE_URL\` secret and set \`DATABASE_SSL=require\`."
              echo "News LinkedIn posting still uses file-based \`content/news\` when LinkedIn secrets are present."
              echo "The secret value is not printed."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

          if [ -n "${LINKEDIN_ACCESS_TOKEN:-}" ] && { [ -n "${LINKEDIN_PERSON_URN:-}" ] || [ -n "${LINKEDIN_ORGANIZATION_URN:-}" ]; }; then
            echo "linkedin_ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "linkedin_ready=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=LinkedIn secrets missing::Set LINKEDIN_ACCESS_TOKEN and LINKEDIN_PERSON_URN (or LINKEDIN_ORGANIZATION_URN)."
          fi

      - name: Generate daily trend briefing
        if: steps.guard.outputs.db_ready == 'true' && vars.VM_OWNS_DAILY_BRIEFING != 'true'
        run: pnpm content:daily:briefing
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DATABASE_SSL: ${{ secrets.DATABASE_SSL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          LLM_PROVIDER: groq
          # llama-3.3-70b-versatile and llama-3.1-8b-instant are enterprise-only and 404.
          # A 404 on GROQ_MODEL tries GROQ_FALLBACK_MODEL, then Gemini. llama-* is never used.
          GROQ_MODEL: openai/gpt-oss-120b
          GROQ_FALLBACK_MODEL: openai/gpt-oss-20b

      - name: Validate LinkedIn access token
        id: linkedin_token
        if: steps.guard.outputs.linkedin_ready == 'true' && vars.VM_OWNS_LINKEDIN_POSTING != 'true'
        env:
          LINKEDIN_ACCESS_TOKEN: ${{ secrets.LINKEDIN_ACCESS_TOKEN }}
        run: |
          set +e
          pnpm tsx scripts/check-linkedin-token.ts
          code=$?
          set -e
          if [ "$code" -eq 0 ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "ok=false" >> "$GITHUB_OUTPUT"
          if [ "$code" -eq 1 ]; then
            bash .github/scripts/open-linkedin-token-issue.sh
          fi
          exit "$code"

      - name: Post news to LinkedIn
        if: steps.guard.outputs.linkedin_ready == 'true' && vars.VM_OWNS_LINKEDIN_POSTING != 'true' && steps.linkedin_token.outputs.ok == 'true'
        run: pnpm content:post:linkedin
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DATABASE_SSL: ${{ secrets.DATABASE_SSL }}
          LINKEDIN_ACCESS_TOKEN: ${{ secrets.LINKEDIN_ACCESS_TOKEN }}
          LINKEDIN_PERSON_URN: ${{ secrets.LINKEDIN_PERSON_URN }}
          LINKEDIN_ORGANIZATION_URN: ${{ secrets.LINKEDIN_ORGANIZATION_URN }}

      - name: Detect LinkedIn news delivery state changes
        id: delivery_state
        if: always() && steps.guard.outputs.linkedin_ready == 'true' && vars.VM_OWNS_LINKEDIN_POSTING != 'true'
        run: |
          if [ ! -f content/generated/linkedin-news-delivery.json ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No file-based LinkedIn news delivery state to commit."
            exit 0
          fi
          git add -- content/generated/linkedin-news-delivery.json
          if git diff --cached --quiet -- content/generated/linkedin-news-delivery.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No LinkedIn news delivery state changes."
            exit 0
          fi
          echo "changed=true" >> "$GITHUB_OUTPUT"

      # main is protected (PR-only + required "validate" check). Persist via PR + auto-merge.
      - name: Persist file-based LinkedIn news delivery state
        if: always() && steps.delivery_state.outputs.changed == 'true'
        id: persist_state
        uses: peter-evans/create-pull-request@v7
        with:
          commit-message: "chore(social): persist file-based LinkedIn news delivery state"
          title: "chore(social): persist file-based LinkedIn news delivery state"
          body: |
            Automated persistence of file-based LinkedIn news delivery state after Daily Trend Briefing.
          branch: chore/linkedin-news-delivery-state
          add-paths: |
            content/generated/linkedin-news-delivery.json

      - name: Mark validation status on LinkedIn news delivery state PR
        if: always() && steps.persist_state.outputs.pull-request-head-sha != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api \
            repos/${{ github.repository }}/statuses/${{ steps.persist_state.outputs.pull-request-head-sha }} \
            -f state=success \
            -f context=validate \
            -f description='Validated LinkedIn news delivery state update' \
            -f target_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

      - name: Auto-merge LinkedIn news delivery state PR
        if: always() && steps.persist_state.outputs.pull-request-number != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          bash .github/scripts/cancel-pending-ci.sh chore/linkedin-news-delivery-state
          gh pr merge ${{ steps.persist_state.outputs.pull-request-number }} \
            --squash --delete-branch --auto || \
          gh pr merge ${{ steps.persist_state.outputs.pull-request-number }} \
            --squash --delete-branch
          bash .github/scripts/dispatch-after-bot-merge.sh \
            ${{ steps.persist_state.outputs.pull-request-number }}

      - name: Summarize failure
        if: failure()
        run: |
          {
            echo "## Daily Trend Briefing failed"
            echo ""
            echo "- Check the workflow logs for the failing step."
            echo "- Confirm Gemini/Groq and LinkedIn credentials are still valid."
            echo "- Review \`content/articles\` output if the briefing step generated files."
            echo "- If news LinkedIn is skipped, confirm \`LINKEDIN_*\` secrets and that \`VM_OWNS_LINKEDIN_POSTING\` is not true on both GHA and VM."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Create failure issue
        if: failure() && steps.linkedin_token.outputs.ok != 'false'
        run: |
          gh issue create \
            --title "[pipeline] ${{ github.workflow }} failed" \
            --body "Workflow: ${{ github.workflow }}\nRun: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\nRef: ${{ github.ref }}" || true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
