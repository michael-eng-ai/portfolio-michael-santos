name: Daily Trend Briefing

on:
  workflow_dispatch:
  schedule:
    - cron: "23 10 * * *"

concurrency:
  group: daily-trend-briefing
  cancel-in-progress: true

permissions:
  contents: write
  issues: write

jobs:
  generate-briefing:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          package-manager-cache: false

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check configuration
        id: guard
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          LINKEDIN_ACCESS_TOKEN: ${{ secrets.LINKEDIN_ACCESS_TOKEN }}
          LINKEDIN_PERSON_URN: ${{ secrets.LINKEDIN_PERSON_URN }}
          LINKEDIN_ORGANIZATION_URN: ${{ secrets.LINKEDIN_ORGANIZATION_URN }}
        run: |
          if [ -n "${DATABASE_URL:-}" ]; then
            echo "db_ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "db_ready=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=Database not configured::DATABASE_URL is not set; briefing generation skips DB path. News LinkedIn uses content/news file fallback when tokens exist."
            {
              echo "## Database not configured"
              echo ""
              echo "\`DATABASE_URL\` is not set. Daily briefing generation that needs Postgres was skipped."
              echo "News LinkedIn posting still runs via file-based \`content/news\` when LinkedIn secrets are present."
              echo "Add the \`DATABASE_URL\` secret to resume the full DB-backed briefing path."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

          if [ -n "${LINKEDIN_ACCESS_TOKEN:-}" ] && { [ -n "${LINKEDIN_PERSON_URN:-}" ] || [ -n "${LINKEDIN_ORGANIZATION_URN:-}" ]; }; then
            echo "linkedin_ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "linkedin_ready=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=LinkedIn secrets missing::Set LINKEDIN_ACCESS_TOKEN and LINKEDIN_PERSON_URN (or LINKEDIN_ORGANIZATION_URN)."
          fi

      - name: Generate daily trend briefing
        if: steps.guard.outputs.db_ready == 'true' && vars.VM_OWNS_DAILY_BRIEFING != 'true'
        run: pnpm content:daily:briefing
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DATABASE_SSL: ${{ secrets.DATABASE_SSL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          LLM_PROVIDER: groq

      - name: Post news to LinkedIn
        if: steps.guard.outputs.linkedin_ready == 'true' && vars.VM_OWNS_LINKEDIN_POSTING != 'true'
        run: pnpm content:post:linkedin
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DATABASE_SSL: ${{ secrets.DATABASE_SSL }}
          LINKEDIN_ACCESS_TOKEN: ${{ secrets.LINKEDIN_ACCESS_TOKEN }}
          LINKEDIN_PERSON_URN: ${{ secrets.LINKEDIN_PERSON_URN }}
          LINKEDIN_ORGANIZATION_URN: ${{ secrets.LINKEDIN_ORGANIZATION_URN }}

      - name: Commit file-based LinkedIn news delivery state
        if: steps.guard.outputs.linkedin_ready == 'true' && vars.VM_OWNS_LINKEDIN_POSTING != 'true'
        run: |
          if [ ! -f content/generated/linkedin-news-delivery.json ]; then
            echo "No file-based LinkedIn news delivery state to commit."
            exit 0
          fi
          if git diff --quiet -- content/generated/linkedin-news-delivery.json; then
            echo "No LinkedIn news delivery state changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/generated/linkedin-news-delivery.json
          git commit -m "chore(social): persist file-based LinkedIn news delivery state"
          git push

      - name: Summarize failure
        if: failure()
        run: |
          {
            echo "## Daily Trend Briefing failed"
            echo ""
            echo "- Check the workflow logs for the failing step."
            echo "- Confirm Gemini/Groq and LinkedIn credentials are still valid."
            echo "- Review \`content/articles\` output if the briefing step generated files."
            echo "- If news LinkedIn is skipped, confirm \`LINKEDIN_*\` secrets and that \`VM_OWNS_LINKEDIN_POSTING\` is not true on both GHA and VM."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Create failure issue
        if: failure()
        run: |
          gh issue create \
            --title "[pipeline] ${{ github.workflow }} failed" \
            --body "Workflow: ${{ github.workflow }}\nRun: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\nRef: ${{ github.ref }}" || true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
