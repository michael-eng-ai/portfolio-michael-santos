name: Daily Trend Briefing

on:
  workflow_dispatch:
  schedule:
    - cron: "23 10 * * *"

concurrency:
  group: daily-trend-briefing
  cancel-in-progress: true

jobs:
  generate-briefing:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          sparse-checkout: |
            scripts/generate-daily-trend-briefing.ts
            scripts/post-to-linkedin.ts
            content/sources/trend-keywords.json
            lib/
            patches/
            package.json
            pnpm-lock.yaml
            tsconfig.json

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          package-manager-cache: false

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate daily trend briefing
        if: vars.VM_OWNS_DAILY_BRIEFING != 'true'
        run: pnpm content:daily:briefing
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          LLM_PROVIDER: groq

      - name: Post latest article to LinkedIn
        if: vars.VM_OWNS_LINKEDIN_POSTING != 'true'
        run: pnpm content:post:linkedin
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          LINKEDIN_ACCESS_TOKEN: ${{ secrets.LINKEDIN_ACCESS_TOKEN }}
          LINKEDIN_PERSON_URN: ${{ secrets.LINKEDIN_PERSON_URN }}
          LINKEDIN_ORGANIZATION_URN: ${{ secrets.LINKEDIN_ORGANIZATION_URN }}

      - name: Summarize failure
        if: failure()
        run: |
          {
            echo "## Daily Trend Briefing failed"
            echo ""
            echo "- Check the workflow logs for the failing step."
            echo "- Confirm Anthropic and LinkedIn credentials are still valid."
            echo "- Review \`content/articles\` output if the briefing step generated files."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Create failure issue
        if: failure()
        run: |
          gh issue create \
            --title "[pipeline] ${{ github.workflow }} failed" \
            --body "Workflow: ${{ github.workflow }}\nRun: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\nRef: ${{ github.ref }}" \
            --label "pipeline-failure" || true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
