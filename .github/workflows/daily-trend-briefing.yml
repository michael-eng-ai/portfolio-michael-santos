name: Daily Trend Briefing

on:
  workflow_dispatch:
  schedule:
    - cron: "23 10 * * *"

concurrency:
  group: daily-trend-briefing
  cancel-in-progress: true

jobs:
  generate-briefing:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          sparse-checkout: |
            scripts/generate-daily-trend-briefing.ts
            content/sources/trend-keywords.json
            lib/
            patches/
            package.json
            pnpm-lock.yaml
            tsconfig.json

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          package-manager-cache: false

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate daily trend briefing
        run: pnpm content:daily:briefing
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
