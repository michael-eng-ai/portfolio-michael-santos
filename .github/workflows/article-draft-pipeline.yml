name: Article Draft Pipeline

on:
  workflow_dispatch:
  schedule:
    - cron: "30 11 * * 1-5"

permissions:
  contents: write
  pull-requests: write
  statuses: write

concurrency:
  group: article-draft-pipeline
  cancel-in-progress: true

jobs:
  generate-article-and-social-drafts:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check configuration
        id: config
        run: |
          if [ -z "${{ secrets.KIMI_API_KEY }}" ] && [ -z "${{ secrets.GEMINI_API_KEY }}" ] && [ -z "${{ secrets.GROQ_API_KEY }}" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "No LLM API key configured (KIMI_API_KEY, GEMINI_API_KEY, GROQ_API_KEY). Skipping article draft pipeline."
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout repository
        if: steps.config.outputs.ready == 'true'
        uses: actions/checkout@v5

      - name: Setup Node.js
        if: steps.config.outputs.ready == 'true'
        uses: actions/setup-node@v6
        with:
          node-version: 22
          package-manager-cache: false

      - name: Enable Corepack
        if: steps.config.outputs.ready == 'true'
        run: corepack enable

      - name: Install dependencies
        if: steps.config.outputs.ready == 'true'
        run: pnpm install --frozen-lockfile

      - name: Generate article draft
        if: steps.config.outputs.ready == 'true'
        run: pnpm content:generate:article
        env:
          KIMI_API_KEY: ${{ secrets.KIMI_API_KEY }}
          KIMI_BASE_URL: ${{ vars.KIMI_BASE_URL }}
          KIMI_MODEL: ${{ vars.KIMI_MODEL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_BASE_URL: ${{ vars.GEMINI_BASE_URL }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_BASE_URL: ${{ vars.GROQ_BASE_URL }}
          GROQ_MODEL: ${{ vars.GROQ_MODEL }}
          LLM_PROVIDER: ${{ vars.LLM_PROVIDER }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DATABASE_SSL: ${{ secrets.DATABASE_SSL }}

      - name: Regenerate LinkedIn drafts
        if: steps.config.outputs.ready == 'true'
        run: pnpm content:linkedin

      - name: Regenerate X drafts
        if: steps.config.outputs.ready == 'true'
        run: pnpm content:x

      - name: Validate content
        if: steps.config.outputs.ready == 'true'
        run: pnpm content:validate

      - name: Create pull request for generated article
        if: steps.config.outputs.ready == 'true'
        id: create_article_pr
        uses: peter-evans/create-pull-request@v7
        with:
          commit-message: "chore: generate article and social drafts"
          title: "chore: generate article and social drafts"
          body: |
            Automated article and social draft generation.
          branch: chore/auto-article-drafts

      - name: Mark validation status on generated article PR
        if: steps.config.outputs.ready == 'true' && steps.create_article_pr.outputs.pull-request-head-sha != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api \
            repos/${{ github.repository }}/statuses/${{ steps.create_article_pr.outputs.pull-request-head-sha }} \
            -f state=success \
            -f context=validate \
            -f description='Validated automated article draft update' \
            -f target_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

      - name: Enable auto-merge on generated article PR
        if: steps.config.outputs.ready == 'true' && steps.create_article_pr.outputs.pull-request-number != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr merge ${{ steps.create_article_pr.outputs.pull-request-number }} \
            --squash --delete-branch --auto || \
          gh pr merge ${{ steps.create_article_pr.outputs.pull-request-number }} \
            --squash --delete-branch

      - name: No automation run
        if: steps.config.outputs.ready != 'true'
        run: echo "Article draft pipeline skipped because no KIMI_API_KEY, GEMINI_API_KEY, or GROQ_API_KEY is configured."
