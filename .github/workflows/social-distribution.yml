name: Social Distribution

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Publish mode
        required: true
        default: slug
        type: choice
        options:
          - slug
          - recent-articles
      slug:
        description: Draft slug to publish (mode=slug)
        required: false
        type: string
      locale:
        description: Locale to publish
        required: true
        default: en
        type: choice
        options:
          - en
          - pt
      channel:
        description: Channel to publish
        required: true
        default: linkedin
        type: choice
        options:
          - all
          - linkedin
          - x
      since:
        description: Article publishedAt lower bound (mode=recent-articles)
        required: false
        default: "2026-07-01"
        type: string
      max:
        description: Max drafts to publish in this run
        required: false
        default: "1"
        type: string
      delay_ms:
        description: Delay between posts in ms
        required: false
        default: "180000"
        type: string
  # After a new article lands on main, publish at most one unpublished LinkedIn draft.
  # Do not watch content/linkedin/** — bot commits that persist publishedUrl would re-trigger a loop.
  push:
    branches: [main]
    paths:
      - "content/articles/**"

concurrency:
  group: social-distribution-${{ github.event_name }}-${{ inputs.slug || github.sha }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  statuses: write
  issues: write
  # Cancel approval-gated CI runs on the bot head branch before auto-merge.
  actions: write

jobs:
  publish-linkedin-drafts:
    if: >
      github.event_name == 'push' ||
      (github.event_name == 'workflow_dispatch' && (inputs.channel == 'all' || inputs.channel == 'linkedin'))
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check LinkedIn credentials
        id: config
        run: |
          if [ -z "${{ secrets.LINKEDIN_ACCESS_TOKEN }}" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=LinkedIn token missing::LINKEDIN_ACCESS_TOKEN is not set. Article draft LinkedIn publishing is skipped."
            exit 0
          fi
          if [ -z "${{ secrets.LINKEDIN_PERSON_URN }}" ] && [ -z "${{ secrets.LINKEDIN_ORGANIZATION_URN }}" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=LinkedIn author missing::Set LINKEDIN_PERSON_URN or LINKEDIN_ORGANIZATION_URN."
            exit 0
          fi
          # On automatic push, skip if the VM owns LinkedIn posting to avoid double posts.
          # Manual workflow_dispatch still runs so operators can catch up from Actions.
          if [ "${{ vars.VM_OWNS_LINKEDIN_POSTING }}" = "true" ] && [ "${{ github.event_name }}" = "push" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "VM_OWNS_LINKEDIN_POSTING=true — skipping automatic LinkedIn draft publish on push."
            exit 0
          fi
          echo "ready=true" >> "$GITHUB_OUTPUT"

      - name: Checkout repository
        if: steps.config.outputs.ready == 'true'
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Node.js
        if: steps.config.outputs.ready == 'true'
        uses: actions/setup-node@v6
        with:
          node-version: 22
          package-manager-cache: false

      - name: Enable Corepack
        if: steps.config.outputs.ready == 'true'
        run: corepack enable

      - name: Install dependencies
        if: steps.config.outputs.ready == 'true'
        run: pnpm install --frozen-lockfile

      - name: Validate LinkedIn access token
        id: linkedin_token
        if: steps.config.outputs.ready == 'true'
        env:
          LINKEDIN_ACCESS_TOKEN: ${{ secrets.LINKEDIN_ACCESS_TOKEN }}
        run: |
          set +e
          pnpm tsx scripts/check-linkedin-token.ts
          code=$?
          set -e
          if [ "$code" -eq 0 ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "ok=false" >> "$GITHUB_OUTPUT"
          if [ "$code" -eq 1 ]; then
            bash .github/scripts/open-linkedin-token-issue.sh
          fi
          exit "$code"

      - name: Publish LinkedIn drafts
        if: steps.config.outputs.ready == 'true' && steps.linkedin_token.outputs.ok == 'true'
        env:
          LINKEDIN_PUBLISH_ENABLED: "true"
          LINKEDIN_ACCESS_TOKEN: ${{ secrets.LINKEDIN_ACCESS_TOKEN }}
          LINKEDIN_PERSON_URN: ${{ secrets.LINKEDIN_PERSON_URN }}
          LINKEDIN_ORGANIZATION_URN: ${{ secrets.LINKEDIN_ORGANIZATION_URN }}
          LINKEDIN_PREFER_IMAGE_SHARE: "true"
        run: |
          set -euo pipefail
          MODE="${{ inputs.mode || 'recent-articles' }}"
          LOCALE="${{ inputs.locale || 'en' }}"
          MAX="${{ inputs.max || '1' }}"
          SINCE="${{ inputs.since || '2026-07-01' }}"
          DELAY_MS="${{ inputs.delay_ms || '180000' }}"
          SLUG="${{ inputs.slug || '' }}"

          if [ "${{ github.event_name }}" = "push" ]; then
            MODE="recent-articles"
            MAX="1"
            SINCE="2026-07-01"
            DELAY_MS="0"
            LOCALE="en"
          fi

          # recent-articles is the automatic path (push or workflow_dispatch).
          # One article, never a backlog, and publishedUrl/status already posted
          # are skipped by the script.
          if [ "$MODE" != "slug" ]; then
            export AUTOMATIC_LINKEDIN_PUBLISH=true
            MAX=1
          fi

          args=(--locale "$LOCALE" --max "$MAX" --delay-ms "$DELAY_MS")
          if [ "$MODE" = "slug" ]; then
            if [ -z "$SLUG" ]; then
              echo "ERROR: mode=slug requires inputs.slug"
              exit 1
            fi
            args+=(--slug "$SLUG")
          else
            args+=(--since "$SINCE" --source-type article)
          fi

          pnpm content:publish:linkedin -- "${args[@]}"

      # Run 29622243863 (2026-07-18) failed by git pushing publish state onto
      # protected main. Persist with a PR instead. Do not git push main here.
      # GITHUB_TOKEN merges do not retrigger this workflow; the article pipeline
      # dispatches it. This job does not dispatch itself, or it would post again.
      - name: Persist published LinkedIn draft state
        if: success() && steps.config.outputs.ready == 'true' && steps.linkedin_token.outputs.ok == 'true'
        id: persist_state
        uses: peter-evans/create-pull-request@v7
        with:
          commit-message: "chore(social): persist LinkedIn publish state"
          title: "chore(social): persist LinkedIn publish state"
          body: |
            Automated persistence of LinkedIn `publishedUrl` / `publishedAt` after Social Distribution.
          branch: chore/linkedin-publish-state
          add-paths: |
            content/linkedin

      - name: Mark validation status on LinkedIn state PR
        if: success() && steps.config.outputs.ready == 'true' && steps.linkedin_token.outputs.ok == 'true' && steps.persist_state.outputs.pull-request-head-sha != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api \
            repos/${{ github.repository }}/statuses/${{ steps.persist_state.outputs.pull-request-head-sha }} \
            -f state=success \
            -f context=validate \
            -f description='Validated LinkedIn publish state update' \
            -f target_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

      - name: Auto-merge LinkedIn state PR
        if: success() && steps.config.outputs.ready == 'true' && steps.linkedin_token.outputs.ok == 'true' && steps.persist_state.outputs.pull-request-number != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          bash .github/scripts/cancel-pending-ci.sh chore/linkedin-publish-state
          gh pr merge ${{ steps.persist_state.outputs.pull-request-number }} \
            --squash --delete-branch --auto || \
          gh pr merge ${{ steps.persist_state.outputs.pull-request-number }} \
            --squash --delete-branch
          # CI only. Dispatching social-distribution here would publish another article.
          bash .github/scripts/dispatch-after-bot-merge.sh \
            ${{ steps.persist_state.outputs.pull-request-number }}

  publish-x-via-api:
    if: >
      github.event_name == 'workflow_dispatch' &&
      (inputs.channel == 'all' || inputs.channel == 'x') &&
      inputs.mode == 'slug' &&
      inputs.slug != ''
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Publish to X (production API)
        run: |
          curl --fail-with-body --request POST \
            --url "https://michael.business/api/x/publish" \
            --header "Content-Type: application/json" \
            --header "x-x-publish-secret: ${{ secrets.X_PUBLISH_SECRET }}" \
            --data '{"slug":"${{ inputs.slug }}","locale":"${{ inputs.locale }}"}'
