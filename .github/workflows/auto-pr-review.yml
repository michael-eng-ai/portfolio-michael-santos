name: Auto PR Review

on:
  pull_request_target:
    types: [opened, synchronize]
    branches:
      - main

concurrency:
  group: pr-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    if: github.event.pull_request.user.type != 'Bot'

    permissions:
      pull-requests: write
      contents: read

    steps:
      - name: Checkout base branch
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.base.ref }}
          fetch-depth: 1

      - name: Get PR diff
        id: diff
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -uo pipefail
          gh pr diff ${{ github.event.pull_request.number }} > /tmp/pr-diff.txt 2>/dev/null || true
          DIFF=$(head -c 8000 /tmp/pr-diff.txt)
          EOF_MARKER=$(dd if=/dev/urandom bs=15 count=1 status=none | base64)
          echo "diff<<${EOF_MARKER}" >> "$GITHUB_OUTPUT"
          echo "${DIFF}" >> "$GITHUB_OUTPUT"
          echo "${EOF_MARKER}" >> "$GITHUB_OUTPUT"

      - name: Review with LLM
        id: review
        env:
          KIMI_API_KEY: ${{ secrets.KIMI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          DIFF_CONTENT: ${{ steps.diff.outputs.diff }}
        run: |
          set -uo pipefail

          PROMPT=$(cat <<EOF
          Review this PR diff as a senior data engineer. Focus on: correctness, security, performance, TypeScript best practices. Be concise. Output format: list of findings with severity (critical/warning/info) and line references when possible.

          If the diff looks clean, say so briefly.

          DIFF:
          ${DIFF_CONTENT}
          EOF
          )

          if [ -n "${KIMI_API_KEY:-}" ]; then
            BODY=$(jq -n \
              --arg model "kimi-k2.5" \
              --arg prompt "$PROMPT" \
              --argjson max_tokens 8192 \
              '{model: $model, max_tokens: $max_tokens, temperature: 1, messages: [{role: "system", content: "You are a senior code reviewer. Be direct and terse."}, {role: "user", content: $prompt}]}')

            RESPONSE=$(curl -sS -X POST https://api.moonshot.ai/v1/chat/completions \
              -H "Content-Type: application/json" \
              -H "Authorization: Bearer ${KIMI_API_KEY}" \
              -d "$BODY")

            REVIEW=$(echo "$RESPONSE" | jq -r '
              if .error then
                "Failed to generate review (Kimi): " + (.error.message // "unknown API error")
              else
                (.choices[0].message.content // "Failed to generate review.")
              end
            ')
          elif [ -n "${GROQ_API_KEY:-}" ]; then
            BODY=$(jq -n \
              --arg model "llama-3.3-70b-versatile" \
              --arg prompt "$PROMPT" \
              --argjson max_tokens 2048 \
              '{model: $model, max_tokens: $max_tokens, temperature: 0.2, messages: [{role: "system", content: "You are a senior code reviewer. Be direct and terse."}, {role: "user", content: $prompt}]}')

            RESPONSE=$(curl -sS -X POST https://api.groq.com/openai/v1/chat/completions \
              -H "Content-Type: application/json" \
              -H "Authorization: Bearer ${GROQ_API_KEY}" \
              -d "$BODY")

            REVIEW=$(echo "$RESPONSE" | jq -r '
              if .error then
                "Failed to generate review (Groq): " + (.error.message // "unknown API error")
              else
                (.choices[0].message.content // "Failed to generate review.")
              end
            ')
          else
            REVIEW="Auto PR review skipped: no LLM API key configured."
          fi

          EOF_MARKER=$(dd if=/dev/urandom bs=15 count=1 status=none | base64)
          echo "review<<${EOF_MARKER}" >> "$GITHUB_OUTPUT"
          echo "${REVIEW}" >> "$GITHUB_OUTPUT"
          echo "${EOF_MARKER}" >> "$GITHUB_OUTPUT"

      - name: Post review comment
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REVIEW_BODY: ${{ steps.review.outputs.review }}
        run: |
          set -euo pipefail

          COMMENT_BODY=$(cat <<EOF
          **Automated Code Review**

          ${REVIEW_BODY}

          ---
          _Automated review by the configured LLM provider. Not a substitute for human review._
          EOF
          )

          gh pr comment ${{ github.event.pull_request.number }} --body "${COMMENT_BODY}"
