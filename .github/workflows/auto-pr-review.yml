name: Auto PR Review

on:
  pull_request_target:
    types: [opened, synchronize]
    branches:
      - main

concurrency:
  group: pr-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    if: github.event.pull_request.user.type != 'Bot'

    permissions:
      pull-requests: write
      contents: read

    steps:
      - name: Checkout base branch
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.base.ref }}
          fetch-depth: 1

      - name: Get PR diff
        id: diff
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -uo pipefail
          gh pr diff ${{ github.event.pull_request.number }} > /tmp/pr-diff.txt 2>/dev/null || true
          DIFF=$(head -c 8000 /tmp/pr-diff.txt)
          EOF_MARKER=$(dd if=/dev/urandom bs=15 count=1 status=none | base64)
          echo "diff<<${EOF_MARKER}" >> "$GITHUB_OUTPUT"
          echo "${DIFF}" >> "$GITHUB_OUTPUT"
          echo "${EOF_MARKER}" >> "$GITHUB_OUTPUT"

      - name: Review with LLM
        id: review
        env:
          KIMI_API_KEY: ${{ secrets.KIMI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          DIFF_CONTENT: ${{ steps.diff.outputs.diff }}
        run: |
          set -uo pipefail

          PROMPT=$(cat <<EOF
          Review this PR diff as a senior data engineer. Focus on: correctness, security, performance, TypeScript best practices. Be concise. Output format: list of findings with severity (critical/warning/info) and line references when possible.

          If the diff looks clean, say so briefly.

          DIFF:
          ${DIFF_CONTENT}
          EOF
          )

          REVIEW=""
          PROVIDER_USED=""

          # Call an OpenAI-compatible chat endpoint. On API error or empty
          # content, return non-zero so the caller falls through to the next
          # provider instead of giving up (a suspended/rate-limited account
          # like Kimi out of balance must not block the whole review).
          try_provider() {
            local name="$1" url="$2" model="$3" key="$4" max_tokens="$5" temp="$6"
            [ -z "$key" ] && return 1

            local body resp content
            body=$(jq -n \
              --arg model "$model" \
              --arg prompt "$PROMPT" \
              --argjson max_tokens "$max_tokens" \
              --argjson temp "$temp" \
              '{model: $model, max_tokens: $max_tokens, temperature: $temp, messages: [{role: "system", content: "You are a senior code reviewer. Be direct and terse."}, {role: "user", content: $prompt}]}')

            resp=$(curl -sS -X POST "$url" \
              -H "Content-Type: application/json" \
              -H "Authorization: Bearer ${key}" \
              -d "$body")

            if echo "$resp" | jq -e '.error' >/dev/null 2>&1; then
              echo "[auto-review] ${name} failed: $(echo "$resp" | jq -r '.error.message // "unknown error"')" >&2
              return 1
            fi

            content=$(echo "$resp" | jq -r '.choices[0].message.content // empty')
            if [ -z "$content" ]; then
              echo "[auto-review] ${name} returned no content" >&2
              return 1
            fi

            REVIEW="$content"
            PROVIDER_USED="$name"
            return 0
          }

          try_provider "Kimi" "https://api.moonshot.ai/v1/chat/completions" "kimi-k2.5" "${KIMI_API_KEY:-}" 8192 1 \
            || try_provider "Groq" "https://api.groq.com/openai/v1/chat/completions" "llama-3.3-70b-versatile" "${GROQ_API_KEY:-}" 2048 0.2 \
            || try_provider "Gemini" "https://generativelanguage.googleapis.com/v1beta/openai/chat/completions" "gemini-flash-latest" "${GEMINI_API_KEY:-}" 2048 0.4 \
            || true

          if [ -z "$REVIEW" ]; then
            REVIEW="Auto PR review skipped: no LLM provider returned a review (check KIMI/GROQ/GEMINI keys and account billing)."
            PROVIDER_USED="none"
          fi

          EOF_MARKER=$(dd if=/dev/urandom bs=15 count=1 status=none | base64)
          echo "review<<${EOF_MARKER}" >> "$GITHUB_OUTPUT"
          echo "${REVIEW}" >> "$GITHUB_OUTPUT"
          echo "${EOF_MARKER}" >> "$GITHUB_OUTPUT"
          echo "provider=${PROVIDER_USED}" >> "$GITHUB_OUTPUT"

      - name: Post review comment
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REVIEW_BODY: ${{ steps.review.outputs.review }}
        run: |
          set -euo pipefail

          COMMENT_BODY=$(cat <<EOF
          **Automated Code Review**

          ${REVIEW_BODY}

          ---
          _Automated review by the configured LLM provider. Not a substitute for human review._
          EOF
          )

          gh pr comment ${{ github.event.pull_request.number }} --body "${COMMENT_BODY}"
